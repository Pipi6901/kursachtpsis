<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1294" viewBox="0 0 1140 1294"><rect width="100%" height="100%" fill="#fff"></rect><rect x="255" y="16" width="170" height="46" rx="23" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="340" y="39" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Начало</text></g><polygon points="146,94 560,94 534,160 120,160" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"></polygon><g><text x="340" y="114.8" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Продажи по неделям, кампании,</text><text x="340" y="139.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">активные каналы</text></g><polygon points="340,192 575,246 340,300 105,246" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"></polygon><g><text x="340" y="233.79999999999998" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Данные есть, недели</text><text x="340" y="258.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">начинаются с понедельника?</text></g><rect x="120" y="332" width="440" height="68" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="340" y="353.8" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Выровнять ряд по неделям от первой до</text><text x="340" y="378.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">последней</text></g><polygon points="340,432 575,482 340,532 105,482" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"></polygon><g><text x="340" y="469.8" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Пропуски не длиннее 4</text><text x="340" y="494.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">недель?</text></g><rect x="120" y="564" width="440" height="68" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="340" y="585.8000000000001" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Заполнить пропуски линейной</text><text x="340" y="610.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">интерполяцией</text></g><polygon points="340,664 575,708 340,752 105,708" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"></polygon><g><text x="340" y="708" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Есть активные каналы?</text></g><rect x="120" y="784" width="440" height="86" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="340" y="802.6" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Для каждой кампании: затраты за день =</text><text x="340" y="827" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">бюджет ÷ число дней; распределить по</text><text x="340" y="851.4" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">неделям пересечения</text></g><polygon points="340,902 575,946 340,990 105,946" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"></polygon><g><text x="340" y="946" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Недель не менее 64?</text></g><rect x="120" y="1022" width="440" height="68" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="340" y="1056" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Вычислить отпечаток данных (SHA-256)</text></g><polygon points="146,1122 560,1122 534,1196 120,1196" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"></polygon><g><text x="340" y="1146.8" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Обучающий набор: недели, значения,</text><text x="340" y="1171.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">затраты, предупреждения</text></g><rect x="255" y="1228" width="170" height="46" rx="23" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="340" y="1251" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Конец</text></g><path d="M340 62 L340 82" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="340,94 333,79 347,79" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"></polygon><path d="M340 160 L340 180" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="r