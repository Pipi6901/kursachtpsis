<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1296" viewBox="0 0 1140 1296"><rect width="100%" height="100%" fill="#fff"></rect><rect x="245" y="16" width="170" height="46" rx="23" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="330" y="39" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Начало</text></g><polygon points="136,92 550,92 524,158 110,158" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"></polygon><g><text x="330" y="112.8" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Бюджет, ограничения долей каналов,</text><text x="330" y="137.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">модель MMM</text></g><rect x="110" y="188" width="440" height="86" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="330" y="206.6" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Границы затрат канала: от нуля до 1,5 ×</text><text x="330" y="231" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">наибольших недельных; учесть ограничения</text><text x="330" y="255.39999999999998" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">долей</text></g><polygon points="330,304 550,352 330,400 110,352" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"></polygon><g><text x="330" y="339.8" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Границы совместимы с</text><text x="330" y="364.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">бюджетом?</text></g><polygon points="330,430 550,478 330,526 110,478" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"></polygon><g><text x="330" y="465.8" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Бюджет вне диапазона</text><text x="330" y="490.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">границ?</text></g><rect x="110" y="556" width="440" height="76" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="330" y="581.8000000000001" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Задать интервал цены μ — предельной</text><text x="330" y="606.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">отдачи денег</text></g><rect x="110" y="662" width="440" height="96" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="330" y="685.6" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Взять середину μ; для каждого канала найти</text><text x="330" y="710" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">затраты, при которых предельная отдача</text><text x="330" y="734.4" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">равна μ</text></g><polygon points="330,788 550,836 330,884 110,836" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"></polygon><g><text x="330" y="823.8000000000001" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Сумма затрат равна</text><text x="330" y="848.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">бюджету?</text></g><rect x="110" y="914" width="440" height="76" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="330" y="939.8000000000001" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Распределить остаточную невязку</text><text x="330" y="964.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">пропорционально затратам</text></g><rect x="110" y="1020" width="440" height="76" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="330" y="1045.8" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Рассчитать эффект по каналам и сравнить с</text><text x="330" y="1070.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">планом кампаний</text></g><polygon points="136,1126 550,1126 524,1200 110,1200" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"></polygon><g><text x="330" y="1150.8" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Распределение, прирост эффекта,</text><text x="330" y="1175.2" font-f