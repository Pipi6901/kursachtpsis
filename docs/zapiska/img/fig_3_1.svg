<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="800" viewBox="0 0 1140 800"><rect width="100%" height="100%" fill="#fff"></rect><rect x="10" y="20" width="210" height="580" rx="8" fill="#f6f6f6" stroke="#000" stroke-width="2.4"></rect><g><text x="26" y="44" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20.4" text-anchor="start" dominant-baseline="central" font-weight="bold" fill="#000">Узел 1. Клиент</text></g><rect x="340" y="20" width="450" height="580" rx="8" fill="#f6f6f6" stroke="#000" stroke-width="2.4"></rect><g><text x="356" y="44" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20.4" text-anchor="start" dominant-baseline="central" font-weight="bold" fill="#000">Узел 2. Сервер приложений</text></g><rect x="910" y="20" width="220" height="580" rx="8" fill="#f6f6f6" stroke="#000" stroke-width="2.4"></rect><g><text x="926" y="44" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20.4" text-anchor="start" dominant-baseline="central" font-weight="bold" fill="#000">Узел 3. Сервис ИИ</text></g><g><text x="115" y="62" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" font-style="italic" fill="#000">браузер, Angular 21</text></g><g><text x="565" y="62" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" font-style="italic" fill="#000">Java 17+, Spring Boot 4</text></g><g><text x="1020" y="62" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" font-style="italic" fill="#000">Python 3.13, FastAPI</text></g><rect x="22" y="84" width="186" height="140" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="115" y="105.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Страницы</text><text x="115" y="129.6" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">гостиницы:</text><text x="115" y="154" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">номера,</text><text x="115" y="178.39999999999998" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">бронирование,</text><text x="115" y="202.8" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">аналитика</text></g><rect x="22" y="244" width="186" height="140" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="115" y="277.4" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Раздел «Прогноз</text><text x="115" y="301.79999999999995" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">продаж»: панель,</text><text x="115" y="326.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">кампании,</text><text x="115" y="350.59999999999997" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">модель</text></g><rect x="22" y="404" width="186" height="140" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="115" y="437.4" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Маршрутизация,</text><text x="115" y="461.79999999999995" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">охранники,</text><text x="115" y="486.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">перехватчик</text><text x="115" y="510.59999999999997" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">токена</text></g><rect x="356" y="84" width="418" height="78" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="565" y="110.8" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Безопасность: фильтр JWT, роли ADMIN,</text><text x="565" y="135.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">MANAGER, USER</text></g><rect x="356" y="184" width="418" height="78" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="565" y="210.79999999999998" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">REST-контроллеры: /rooms, /reservations,</text><text x="565" y="235.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">/api/forecast</text></g><rect x="356" y="284" width="418" height="78" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="565" y="310.8" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Бизнес-логика: бронирование, кампании,</text><text x="565" y="335.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">продажи, сценарии, мониторинг</text></g><rect x="356" y="384" width="418" height="78" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="565" y="411.10499999999996" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="19.5" text-anchor="middle" dominant-baseline="central" fill="#000">Шлюз ИИ: тайм-ауты, повторы,</text><text x="565" y="434.895" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="19.5" text-anchor="middle" dominant-baseline="central" fill="#000">предохранитель, кэш, упрощённый прогноз</text></g><rect x="356" y="484" width="418" height="78" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="565" y="510.8" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Доступ к данным: Spring Data JPA,</text><text x="565" y="535.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Hibernate</text></g><path d="M565 162 L565 173" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="565,184 558,169 572,169" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"></polygon><path d="M565 262 L565 273" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="565,284 558,269 572,269" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"></polygon><path d="M565 362 L565 373" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="565,384 558,369 572,369" fill="#000" stroke="#000" 