<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1362" viewBox="0 0 1140 1362"><rect width="100%" height="100%" fill="#fff"></rect><rect x="245" y="16" width="170" height="46" rx="23" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="330" y="39" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Начало</text></g><polygon points="136,92 550,92 524,158 110,158" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"></polygon><g><text x="330" y="112.8" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Ряд продаж, матрица затрат, параметры</text><text x="330" y="137.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">проверки</text></g><polygon points="330,188 550,236 330,284 110,236" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"></polygon><g><text x="330" y="223.79999999999998" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Истории достаточно для</text><text x="330" y="248.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">проверки?</text></g><rect x="110" y="314" width="440" height="86" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="330" y="344.8" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Определить окна проверки: четыре окна по</text><text x="330" y="369.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">12 недель встык, последнее — в конце ряда</text></g><rect x="110" y="430" width="440" height="130" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="330" y="448.64" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle" dominant-baseline="central" fill="#000">Для каждого из четырёх алгоритмов: в каждом</text><text x="330" y="471.82" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle" dominant-baseline="central" fill="#000">окне обучить модель заново с подбором</text><text x="330" y="495" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle" dominant-baseline="central" fill="#000">параметров, спрогнозировать окно, рассчитать</text><text x="330" y="518.18" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle" dominant-baseline="central" fill="#000">метрики; при нехватке истории алгоритм</text><text x="330" y="541.36" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle" dominant-baseline="central" fill="#000">пропускается</text></g><rect x="110" y="590" width="440" height="76" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="330" y="615.8000000000001" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Рассчитать выигрыш каждого алгоритма</text><text x="330" y="640.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">относительно наивной модели</text></g><polygon points="330,696 550,744 330,792 110,744" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"></polygon><g><text x="330" y="731.8000000000001" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Есть алгоритмы,</text><text x="330" y="756.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">учитывающие маркетинг?</text></g><rect x="110" y="822" width="440" height="108" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="330" y="852.21" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="19.5" text-anchor="middle" dominant-baseline="central" fill="#000">Выбрать лучший по WAPE среди алгоритмов,</text><text x="330" y="876" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="19.5" text-anchor="middle" dominant-baseline="central" fill="#000">учитывающих маркетинг; бустинг заменяет</text><text x="330" y="899.7900000000001" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="19.5" text-anchor="middle" dominant-baseline="central" fill="#000">MMM, только если точнее более чем на 5 %</text></g><rect x="110" y="960" width="440" height="96" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="330" y="983.6" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Обучить чемпиона на всём ряде; по модели</text><text x="330" y="1008" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">MMM рассчитать вклады, возврат и</text><text x="330" y="1032.4" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">насыщение каналов</text></g><rect x="110" y="1086" width="440" height="76" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="330" y="1111.8" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Сохранить квантили относительных ошибок</text><text x="330" y="1136.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">проверки для интервала прогноза</text></g><polygon points="136,1192 550,1192 524,1266 110,1266" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"></polygon><g><text x="330" y="1216.8" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Метрики, таблица лидеров, эффекты</text><text x="330" y="1241.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">каналов, предупреждения</text></g><rect x="245" y="1296" width="170" height="46" rx="23" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="330" y="1319" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Конец</text></g><path d="M330 62 L330 80" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="330,92 323,77 337,77" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"></polygon><path d="M330 158 L330 176" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="330,188 323,173 337,173" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"></polygon><path d="M330 284 L330 302" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="330,314 323,299 337,299" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"></polygon><g><text x="342" y="301" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="18.400000000000002" text-anchor="start" dominant-baseline="central" fill="#000">Да</text></g><rect x="735" y="204" width="340" height="64" rx="32" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="905" y="236" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Ошибка: недостаточно данных</text></g><path d="M550 236 L723 236" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="735,236 720,229 720,243" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"></polygon><g><text x="642.5" y="221" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="18.400000000000002" text-anchor="middle" dominant-baseline="central" fill="#000">Нет</text></g><path d="M330 400 L330 418" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="330,430 323,415 337,415" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"></polygon><path d="M330 560 L330 578" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="330,590 323,575 337,575" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"></polygon><path d="M330 666 L330 684" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="330,696 323,681 337,681" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"></polygon><path d="M330 792 L330 810" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="330,822 323,807 337,807" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"></polygon><g><text x="342" y="809" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="18.400000000000002" text-anchor="start" dominant-baseline="central" fill="#000">Да</text></g><rect x="755" y="706" width="300" height="76" rx="0" fill="#fff" stroke="#000" stroke-width="2.4"></rect><g><text x="905" y="731.8000000000001" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">Предупреждение; выбрать</text><text x="905" y="756.2" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#000">лучший по WAPE среди всех</text></g><path d="M550 744 L743 744" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="755,744 740,737 740,751" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"></polygon><g><text x="652.5" y="729" font-family="&quot;Liberation Sans&quot;, Arial, Helvetica, sans-serif" font-size="18.400000000000002" text-anchor="middle" dominant-baseline="central" fill="#000">Нет</text></g><path d="M905 782 L905 1008 L562 1008" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="550,1008 565,1001 565,1015" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"></polygon><path d="M330 930 L330 948" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="330,960 323,945 337,945" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"></polygon><path d="M330 1056 L330 1074" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="330,1086 323,1071 337,1071" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"></polygon><path d="M330 1162 L330 1180" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="330,1192 323,1177 337,1177" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"></polygon><path d="M330 1266 L330 1284" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="330,1296 323,1281 337,1281" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"></polygon></svg>