# Интеграционные тесты изолированы от основной БД: используется встраиваемая H2
spring.datasource.url=jdbc:h2:mem:forecast_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
jwt.secret=test-secret-test-secret-test-secret-test-secret-0123456789

# Модуль прогнозирования
forecast.ai.api-key=test-key
forecast.ai.connect-timeout=PT1S
forecast.ai.inference-timeout=PT1S
forecast.ai.training-timeout=PT10S
forecast.demo-data.enabled=true
forecast.bootstrap.train-on-startup=false
forecast.retrain.enabled=false

# Предохранитель срабатывает быстрее, чем в рабочей конфигурации
resilience4j.circuitbreaker.instances.mlService.sliding-window-size=4
resilience4j.circuitbreaker.instances.mlService.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.mlService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mlService.wait-duration-in-open-state=30s
resilience4j.retry.instances.mlService.max-attempts=2
resilience4j.retry.instances.mlService.wait-duration=10ms
