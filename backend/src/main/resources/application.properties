spring.application.name=HotelManager
server.port=8080

spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel

spring.main.allow-bean-definition-overriding=true
logging.level.org.springframework.security=DEBUG    
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/
spring.main.allow-circular-references=true
spring.web.resources.static-locations=file:D:/hotel_images/rooms/
#spring.web.resources.static-locations=file:D:/example_images/

upload.img=D:/hotel_images/rooms/

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

# JWT settings
jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-string-0123456789}
jwt.lifetime=PT3H


# ---------------------------------------------------------------------------
# Модуль «Прогноз продаж с учётом мультиканальных маркетинговых активностей»
# ---------------------------------------------------------------------------
# Интеллектуальный микросервис (отдельный узел). Адрес и ключ задаются переменными окружения.
forecast.ai.base-url=${ML_SERVICE_URL:http://localhost:8001}
forecast.ai.api-key=${ML_API_KEY:dev-ml-key-change-me}
forecast.ai.connect-timeout=PT2S
forecast.ai.inference-timeout=PT8S
forecast.ai.training-timeout=PT5M
# HTTPS между узлами: хранилище доверенных сертификатов (PKCS12), если сервис использует самоподписанный сертификат
forecast.ai.trust-store=${ML_TRUST_STORE:}
forecast.ai.trust-store-password=${ML_TRUST_STORE_PASSWORD:changeit}

# Демонстрационные данные (создаются один раз, только если таблицы модуля пусты)
forecast.demo-data.enabled=true
# Автоматическое первичное обучение моделей после запуска (повторы, пока ML-сервис не станет доступен)
forecast.bootstrap.train-on-startup=true
# Плановое переобучение: по понедельникам в 03:00, если данные изменились или модели нет
forecast.retrain.enabled=true
forecast.retrain.cron=0 0 3 * * MON
# Кэш прогнозов
forecast.cache.ttl=PT10M
forecast.cache.max-size=200

# Устойчивость интеграции: предохранитель (circuit breaker) и повторные попытки
resilience4j.circuitbreaker.instances.mlService.sliding-window-size=10
resilience4j.circuitbreaker.instances.mlService.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.mlService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mlService.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.mlService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.mlService.record-exceptions=com.HotelManager.forecast.ai.AiUnavailableException
resilience4j.retry.instances.mlService.max-attempts=2
resilience4j.retry.instances.mlService.wait-duration=300ms
resilience4j.retry.instances.mlService.retry-exceptions=com.HotelManager.forecast.ai.AiUnavailableException
