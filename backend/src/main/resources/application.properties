spring.application.name=HotelManager
server.port=8080

spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel

spring.main.allow-bean-definition-overriding=true
logging.level.org.springframework.security=DEBUG    
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/
spring.main.allow-circular-references=true
spring.web.resources.static-locations=file:D:/hotel_images/rooms/
#spring.web.resources.static-locations=file:D:/example_images/

upload.img=D:/hotel_images/rooms/

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

# JWT settings
jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-string-0123456789}
jwt.lifetime=PT3H

