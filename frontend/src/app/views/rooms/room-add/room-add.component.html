<div class="breadcrumb-section">
  <div class="container">
    <div class="breadcrumb-text">
      <h2>Добавить номер</h2>
      <div class="bt-option">
        <a routerLink="/rooms">Номера</a>
        <span>Новый номер</span>
      </div>
    </div>
  </div>
</div>

<section class="room-form-page">
  <div class="container">
    <form enctype="multipart/form-data" (submit)="$event.preventDefault()">
      <app-room-fields [form]="addRoomForm"
                       (amenitiesChange)="amenities = $event"
                       (photosChange)="photos = $event"></app-room-fields>

      <div class="room-form-actions">
        <a routerLink="/rooms" class="hm-btn hm-btn--outline">Отмена</a>
        <button type="button" class="hm-btn hm-btn--lg" [disabled]="addRoomForm.invalid || saving" (click)="addRoom()">
          {{ saving ? "Сохраняем…" : "Добавить номер" }}
        </button>
      </div>
      @if (addRoomForm.invalid && addRoomForm.touched) {
        <p class="room-form-hint">Заполните обязательные поля: название, цену, описание, номер комнаты и этаж.</p>
      }
    </form>
  </div>
</section>
