<div class="breadcrumb-section">
  <div class="container">
    <div class="breadcrumb-text">
      <h2>Редактировать номер</h2>
      <div class="bt-option">
        <a routerLink="/rooms">Номера</a>
        <a [routerLink]="'/rooms/' + originRoom.id">{{ originRoom.name }}</a>
        <span>Редактирование</span>
      </div>
    </div>
  </div>
</div>

<section class="room-form-page">
  <div class="container">
    @if (loaded) {
      <form enctype="multipart/form-data" (submit)="$event.preventDefault()">
        <app-room-fields [form]="roomForm" [images]="images" [amenities]="amenities"
                         (amenitiesChange)="amenities = $event"
                         (photosChange)="photos = $event"></app-room-fields>

        <div class="room-form-actions">
          <a [routerLink]="'/rooms/' + originRoom.id" class="hm-btn hm-btn--outline">Отмена</a>
          <button type="button" class="hm-btn hm-btn--lg" [disabled]="roomForm.invalid || saving" (click)="editRoom()">
            {{ saving ? "Сохраняем…" : "Сохранить изменения" }}
          </button>
        </div>
      </form>
    }
  </div>
</section>
