<div class="breadcrumb-section">
  <div class="container">
    <div class="breadcrumb-text">
      <h2>Финансовая статистика</h2>
      <div class="bt-option">
        <a routerLink="/">Главная</a>
        <span>Статистика</span>
      </div>
    </div>
  </div>
</div>

@if (statistics) {
  <section class="stat-page">
    <div class="container">
      <div class="stat-toolbar">
        <button class="hm-btn hm-btn--dark" (click)="generatePDF()">
          <app-icon name="download" [size]="17"></app-icon>Сгенерировать PDF
        </button>
      </div>
      <div class="hm-card stat-body" #generatePdf>
        <div class="stat-chart">
          <div id="top5Income" style="width: 600px; height: 400px; max-width: 100%"></div>
        </div>
        <div class="stat-total">
          <span>Суммарная прибыль</span>
          <b>{{ statistics.totalIncome }}</b>
        </div>
        <table class="table stat-table">
          <thead>
            <tr><th>Название</th><th class="stat-num">Прибыль</th></tr>
          </thead>
          <tbody>
            @for (room of statistics.topRoomsByIncome; track room.roomName) {
              <tr><td>{{ room.roomName }}</td><td class="stat-num">{{ room.income }}</td></tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </section>
}
