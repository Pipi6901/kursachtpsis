<div class="breadcrumb-section">
  <div class="container">
    <div class="breadcrumb-text">
      <h2>Управление правами</h2>
      <div class="bt-option">
        <a routerLink="/">Главная</a>
        <span>Пользователи</span>
      </div>
    </div>
  </div>
</div>

<section class="users-page">
  <div class="container">
    <div class="us-search">
      <app-icon name="search" [size]="18"></app-icon>
      <input type="text" class="form-control" placeholder="Найти пользователя по логину" [formControl]="searchField"/>
    </div>

    <div class="hm-card us-table">
      <div class="us-row us-row--head">
        <span>Логин</span><span>Роль</span><span class="us-actions-head">Действия</span>
      </div>
      @for (user of users; track user.id) {
        <form class="us-row" (submit)="$event.preventDefault()">
          <div class="us-user">
            <span class="us-ava">{{ (user.name || '?').charAt(0).toUpperCase() }}</span>
            <b>{{ user.name }}</b>
          </div>
          <select name="role" required class="form-select" [(ngModel)]="user.roles" aria-label="Роль">
            @for (roleUserType of RoleTypeTypes; track roleUserType) {
              <option [value]="roleUserType">{{ roleUserType }}</option>
            }
          </select>
          <div class="us-actions">
            <button type="button" class="hm-btn hm-btn--sm" (click)="updateRole(user)">Обновить</button>
            <button type="button" class="hm-btn hm-btn--danger hm-btn--sm" (click)="deleteUser(user.id)">Удалить</button>
          </div>
        </form>
      } @empty {
        <div class="us-empty">Пользователи не найдены.</div>
      }
    </div>
  </div>
</section>
