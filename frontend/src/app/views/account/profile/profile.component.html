<div class="breadcrumb-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="breadcrumb-text">
          <h2>Профиль</h2>
        </div>
      </div>
    </div>
  </div>
</div>


<section class="contact-section">
  <div class="container">
    <div class="row">
        <div class="contact-form">
          <div class="row">
            <div class="col-lg-7">
              <h4 class="my-2">Редактировать данные</h4>
              <hr>
              <form [formGroup]="profileForm">
                <div class="col-lg-12">
                  <p class="lead mb-1">ФИО</p>
                  <input class="form-control mb-2" type="text" placeholder="ФИО"
                         [ngStyle]="{'border-color': profileForm.get('name')?.invalid
                 && (profileForm.get('name')?.dirty || profileForm.get('name')?.touched) ? 'red' : '' }"
                         formControlName="name">
                </div>
                <div class="col-lg-12">
                  <p class="lead mb-1">Тел. номер</p>
                  <input class="form-control mb-2" type="tel" placeholder="Телефон"
                         [ngStyle]="{'border-color': profileForm.get('phone')?.invalid
                 && (profileForm.get('phone')?.dirty || profileForm.get('phone')?.touched) ? 'red' : '' }"
                         formControlName="phone">
                </div>
                <div class="col-lg-12">
                  <p class="lead mb-1">Эл. почта</p>
                  <input class="form-control mb-2" type="email" placeholder="Эл. почта"
                         [ngStyle]="{'border-color': profileForm.get('email')?.invalid
                 && (profileForm.get('email')?.dirty || profileForm.get('email')?.touched) ? 'red' : '' }"
                         formControlName="email">
                </div>
                <div class="col-lg-12">
                  <button type="button" (click)="updateProfile()" class="w-100">Редактировать данные</button>
                </div>
              </form>
            </div>
            <div class="col-lg-4" *ngIf="!isManager && !isAdmin">
              <h4 class="my-2">Пополнить баланс</h4>
              <hr>
              <form [formGroup]="balanceForm">
              <p class="lead mb-1">Баланс</p>
              <input class="form-control mb-2" type="number" placeholder="Введите сумму"
                     [ngStyle]="{'border-color': profileForm.get('balance')?.invalid
                 && (profileForm.get('balance')?.dirty || profileForm.get('balance')?.touched) ? 'red' : '' }"
                     formControlName="balance">
              <button type="button" (click)="updateBalance()" class="w-100">Пополнить баланс</button>
              </form>
            </div>
          </div>
        </div>
      </div>
  </div>
</section>
