<section class="auth">
  <div class="auth__aside" style="background-image: url('assets/img/hero/hero-3.jpg')">
    <div class="auth__aside-in">
      <span class="auth__eyebrow">Добро пожаловать</span>
      <h2>Бронируйте номера в пару кликов</h2>
      <p>Личный кабинет хранит ваши бронирования, чеки и баланс. Регистрация занимает минуту.</p>
    </div>
  </div>

  <div class="auth__main">
    <div class="auth__card">
      <h1>Регистрация</h1>
      <p class="auth__sub">Создайте личный кабинет гостя HotelMariot.</p>

      <form [formGroup]="signupForm">
        <div class="auth__field">
          <label class="hm-label" for="su-name">ФИО</label>
          <input id="su-name" class="form-control" type="text" autocomplete="name"
                 [class.is-invalid]="signupForm.get('name')?.invalid && (signupForm.get('name')?.dirty || signupForm.get('name')?.touched)"
                 placeholder="ФИО" name="fio" formControlName="name">
        </div>
        <div class="row g-3">
          <div class="col-sm-6 auth__field">
            <label class="hm-label" for="su-phone">Телефон</label>
            <input id="su-phone" class="form-control" type="tel" appPhoneMask autocomplete="tel"
                   [class.is-invalid]="signupForm.get('phone')?.invalid && (signupForm.get('phone')?.dirty || signupForm.get('phone')?.touched)"
                   placeholder="Ваш номер телефона" formControlName="phone">
          </div>
          <div class="col-sm-6 auth__field">
            <label class="hm-label" for="su-email">Электронная почта</label>
            <input id="su-email" class="form-control" type="email" autocomplete="email"
                   [class.is-invalid]="signupForm.get('email')?.invalid && (signupForm.get('email')?.dirty || signupForm.get('email')?.touched)"
                   placeholder="Электронная почта" formControlName="email">
          </div>
        </div>
        <div class="row g-3">
          <div class="col-sm-6 auth__field">
            <label class="hm-label" for="su-username">Логин</label>
            <input id="su-username" class="form-control" type="text" autocomplete="username"
                   [class.is-invalid]="signupForm.get('username')?.invalid && (signupForm.get('username')?.dirty || signupForm.get('username')?.touched)"
                   placeholder="Логин" name="username" formControlName="username">
          </div>
          <div class="col-sm-6 auth__field">
            <label class="hm-label" for="su-password">Пароль</label>
            <input id="su-password" class="form-control" type="password" autocomplete="new-password"
                   [class.is-invalid]="signupForm.get('password')?.invalid && (signupForm.get('password')?.dirty || signupForm.get('password')?.touched)"
                   placeholder="Пароль" formControlName="password">
          </div>
        </div>
        <button type="submit" class="hm-btn hm-btn--lg hm-btn--block" [disabled]="signupForm.invalid" (click)="signup()">Зарегистрироваться</button>
      </form>

      <p class="auth__switch">Уже есть аккаунт? <a routerLink="/login">Войдите</a></p>
    </div>
  </div>
</section>
