<div class="drp" (mouseleave)="setHover(null)">
  <div class="drp-head">
    <button type="button" class="drp-nav" (click)="prevMonth()" [disabled]="!canGoBack" aria-label="Предыдущий месяц">&lsaquo;</button>
    <div class="drp-title">{{ monthTitle }}</div>
    <button type="button" class="drp-nav" (click)="nextMonth()" aria-label="Следующий месяц">&rsaquo;</button>
  </div>

  <table class="drp-grid">
    <thead>
    <tr><th *ngFor="let w of weekdays">{{ w }}</th></tr>
    </thead>
    <tbody>
    <tr *ngFor="let week of weeks; trackBy: trackByIndex">
      <td *ngFor="let cell of week; trackBy: trackByIndex">
        <button *ngIf="cell" type="button" class="drp-day"
                [class.busy]="cell.busy" [class.past]="cell.disabled && !cell.busy"
                [class.start]="cell.start" [class.end]="cell.end" [class.range]="cell.inRange"
                [class.can-end]="cell.clickable && !cell.start && from && !to"
                [disabled]="!cell.clickable && !cell.start && !cell.end"
                [attr.aria-label]="cell.iso" (click)="select(cell)" (mouseenter)="setHover(cell)">
          {{ cell.day }}
        </button>
      </td>
    </tr>
    </tbody>
  </table>

  <div class="drp-legend">
    <span><i class="free"></i>свободно</span>
    <span><i class="busy"></i>занято</span>
    <span><i class="sel"></i>ваш выбор</span>
  </div>

  <div class="drp-summary">
    <div><span>Заезд:</span> <b>{{ from ? format(from) : 'выберите дату' }}</b></div>
    <div><span>Выезд:</span> <b>{{ to ? format(to) : (from ? 'выберите дату выезда' : '—') }}</b></div>
    <div *ngIf="nights > 0"><span>Срок:</span> <b>{{ nights }} {{ nightsWord }}</b></div>
  </div>
  <div class="drp-hint" *ngIf="hint">{{ hint }}</div>
  <button type="button" class="drp-reset" *ngIf="from" (click)="reset()">Сбросить даты</button>
</div>
